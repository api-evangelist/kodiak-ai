aid: kodiak-ai
name: Kodiak AI
description: 'Kodiak AI, Inc. (formerly Kodiak Robotics) is a Mountain View, California
  company founded in 2018 that builds AI-powered ground autonomy — the "Kodiak Driver"
  — for long-haul freight trucking and for off-road, industrial, and defense ground
  vehicles. The company sells a turnkey driver-as-a-product to fleet operators rather
  than a public developer API: its surface is a corporate website, a news/press feed,
  a safety report, and investor-relations material. Kodiak has run driverless
  operations for partners including Atlas Energy, Roehl Transport, Martin Brower,
  Tyson Foods, and West Fraser, and works with Bosch, NVIDIA, and General Dynamics
  Land Systems on hardware and defense autonomy. It reports more than 2.6 million
  autonomous miles and 7,000+ delivered loads. No public API, SDK, developer portal,
  or OpenAPI definition has been found; the company does publish an llms.txt for
  AI crawlers.'
